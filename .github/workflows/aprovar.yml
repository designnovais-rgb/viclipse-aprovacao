name: Aprovar e postar corte
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: aprovacao
  cancel-in-progress: false
jobs:
  processar:
    # so o dono do repositorio pode aprovar/postar
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[APROVAR]') || startsWith(github.event.issue.title, '[REPROVAR]') || startsWith(github.event.issue.title, '[TESTE]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji > /dev/null
          pip install -q pillow
      - name: Processar pedido
        env:
          GH_TOKEN: ${{ github.token }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/processar.py
      - name: Salvar catalogo
        run: |
          git config user.name "viclipse-bot"
          git config user.email "viclipse-bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "catalogo: pedido #${{ github.event.issue.number }}" && git push)
